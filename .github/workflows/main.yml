
name: Gerar APK ELTON V20

on:
  workflow_dispatch:
  push:
    paths:
      - "ELTON_V20.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extrair projeto
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p projeto
          unzip -o ELTON_V20.zip -d projeto

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        shell: bash
        run: |
          set -eu
          cd projeto
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          elif [ -f app/build.gradle ] || [ -f app/build.gradle.kts ]; then
            gradle assembleDebug --no-daemon
          else
            echo "Não encontrei a configuração do módulo Android."
            find . -maxdepth 4 -type f
            exit 1
          fi

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ELTON-V20-APK
          path: projeto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
