
name: Build CLOUD GAMING V4

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'CLOUD_GAMING_ANDROID_SEGURANCA_V4-1.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto Android V4
        run: |
          test -f CLOUD_GAMING_ANDROID_SEGURANCA_V4-1.zip
          mkdir -p /tmp/cloud-gaming-v4
          unzip -q CLOUD_GAMING_ANDROID_SEGURANCA_V4-1.zip -d /tmp/cloud-gaming-v4
          cp -a /tmp/cloud-gaming-v4/. .

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compilar APK
        run: gradle --no-daemon assembleDebug

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: CLOUD-GAMING-APK-V4
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
