name: Gerar APK ELTON V20

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Extrair projeto ZIP
        run: |
          unzip -o ELTON_V20.zip -d projeto
          find projeto -name gradlew -type f

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar APK
        run: |
          cd projeto
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ELTON-V20-APK
          path: projeto/**/app/build/outputs/apk/debug/*.apk
