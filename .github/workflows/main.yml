
name: Gerar APK ELTON V20

on:
  workflow_dispatch:
  push:
    paths:
      - "ELTON_V20.zip"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Extrair projeto V20
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p projeto
          unzip -o ELTON_V20.zip -d projeto

      - name: Encontrar Gradle
        id: gradle
        shell: bash
        run: |
          GRADLEW=$(find projeto -type f -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERRO: não encontrei o arquivo gradlew."
            echo "Conteúdo do ZIP:"
            find projeto -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          chmod +x "$GRADLEW"

      - name: Compilar APK Android
        working-directory: projeto
        run: |
          GRADLEW=$(find . -type f -name gradlew -print -quit)
          cd "$(dirname "$GRADLEW")"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: ELTON-V20-APK
          path: projeto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
