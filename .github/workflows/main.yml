
name: Gerar APK ELTON CLOUD GAMING V20

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Verificar e extrair ZIP
        shell: bash
        run: |
          set -e
          if [ ! -f ELTON_V20.zip ]; then
            echo "ERRO: ELTON_V20.zip não encontrado."
            ls -la
            exit 1
          fi

          mkdir -p projeto
          unzip -oq ELTON_V20.zip -d projeto

          echo "Conteúdo do projeto:"
          find projeto -maxdepth 4 -type f | head -200

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          GRADLEW=""
          while IFS= read -r arquivo; do
            pasta="$(dirname "$arquivo")"
            if [ -f "$pasta/settings.gradle" ] || \
               [ -f "$pasta/settings.gradle.kts" ] || \
               [ -f "$pasta/build.gradle" ] || \
               [ -f "$pasta/build.gradle.kts" ]; then
              GRADLEW="$arquivo"
              break
            fi
          done < <(find "$GITHUB_WORKSPACE/projeto" \
            -type f -name gradlew -print)

          if [ -z "$GRADLEW" ]; then
            echo "ERRO: Gradle Wrapper não encontrado."
            echo "Arquivos de configuração encontrados:"
            find projeto -type f \
              \( -name 'settings.gradle*' \
              -o -name 'build.gradle*' \
              -o -name 'gradle-wrapper.properties' \) -print
            exit 1
          fi

          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"
          echo "PROJETO_ANDROID=$(dirname "$GRADLEW")" \
            >> "$GITHUB_ENV"

      - name: Preparar Gradle
        shell: bash
        run: |
          set -e
          cd "$PROJETO_ANDROID"
          chmod +x "$GRADLEW"
          "$GRADLEW" --version

      - name: Compilar APK
        shell: bash
        run: |
          set -e
          cd "$PROJETO_ANDROID"
          "$GRADLEW" --no-daemon assembleDebug

      - name: Preparar arquivo APK
        shell: bash
        run: |
          set -e
          mkdir -p entrega

          find "$GITHUB_WORKSPACE/projeto" \
            -type f -path '*/build/outputs/apk/debug/*.apk' \
            -exec cp {} entrega/ \;

          if ! ls entrega/*.apk >/dev/null 2>&1; then
            echo "ERRO: A compilação não gerou nenhum APK."
            exit 1
          fi

          ls -lh entrega/

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: ELTON-CLOUD-GAMING-V20-APK
          path: entrega/*.apk
          if-no-files-found: error
          retention-days: 7
